spring.application.name=code-challenge

# disable banner to prevent garbage on Kibana
spring.main.banner-mode=off

# health probes
management.server.port=9090
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info,prometheus,startup
management.endpoint.prometheus.enabled=true
management.endpoint.health.probes.enabled=true


# datasource properties
spring.datasource.url=jdbc:postgresql://${code-challenge.database.host}/${code-challenge.database.name}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${code-challenge.database.username}
spring.datasource.password=${code-challenge.database.password}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.baselineOnMigrate=true
spring.flyway.locations=classpath:db/migration
